<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Globulos</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* --- Reset de base --- */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%; height: 95%;
        background: #000;
        overflow: hidden;
        touch-action: none; /* Desactive le scroll/zoom natif du navigateur */
      }

      /* --- Overlay "tournez votre telephone" --- */
      #rotate-device-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        color: #fff;
        font-size: 1.4rem;
        text-align: center;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      /* Affiche l overlay uniquement sur mobile en mode portrait */
      @media screen and (max-width: 767px) and (orientation: portrait) {
        #rotate-device-overlay { display: flex; }
      }

      /* --- Conteneur Unity --- */
      #unity-container {
        /* position: fixed;  */
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;             /* Active Flexbox */
        justify-content: center;   /* Centre horizontalement */
        align-items: center;       /* Centre verticalement */
        aspect-ratio: 16 / 9; /* 👈 Force le ratio sans étirer l'image */
        object-fit: contain;  /* 👈 Empêche toute déformation */
        position: relative;
      }

      /* Le canvas prend tout l ecran sur mobile */
      #unity-canvas {
        width: 960px;
        height: 540px;
        max-width: 100vw;   /* 👈 Empêche le canvas de dépasser en largeur */
        max-height: 100dvh; /* 👈 Empêche le canvas de dépasser en hauteur */
        aspect-ratio: 16 / 9; /* 👈 Force le ratio sans étirer l'image */
        object-fit: contain;  /* 👈 Empêche toute déformation */
        display: block;
      }
      

      /* --- Barre de chargement --- */
      #unity-loading-bar {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
      }

      #unity-logo {
        width: 120px; height: 120px;
        background: url('TemplateData/unity-logo-dark.png') center/contain no-repeat;
        margin-bottom: 24px;
      }

      #unity-progress-bar-empty {
        width: 60%;
        max-width: 300px;
        height: 8px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
      }

      #unity-progress-bar-full {
        height: 100%;
        width: 0;
        background: #4fc3f7;
        border-radius: 4px;
        transition: width 0.2s ease;
      }

      /* --- Footer (fullscreen + titre) --- */
      #unity-footer {
        position: fixed; /* Passe de absolute à fixed */
          bottom: 0;
          left: 0;
          right: 0;
          display: flex;
          align-items: center;
          justify-content: flex-end;
          padding: 4px 8px;
          background: rgba(0, 0, 0, 0.4);
          pointer-events: none;
          z-index: 10;
      }

      #unity-fullscreen-button {
        width: 32px; height: 32px;
        cursor: pointer;
        pointer-events: all;
        background: url('TemplateData/fullscreen-button.png') center/contain no-repeat;
        opacity: 0.7;
      }
      #unity-fullscreen-button:hover { opacity: 1; }

      #unity-build-title {
        color: #ccc;
        font-size: 0.75rem;
        margin-left: 8px;
        pointer-events: none;
      }

      /* --- Bandeau d avertissement --- */
      #unity-warning {
        position: absolute;
        top: 0; left: 0; right: 0;
        z-index: 100;
      }
    </style>
  </head>
  <body>

    <!-- Overlay portrait mobile -->
    <div id="rotate-device-overlay">
      <div>
        <div style="font-size:3rem;margin-bottom:16px">📱</div>
        <p>Veuillez tourner votre téléphone<br>en mode <strong>paysage</strong> pour jouer.</p>
      </div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Globulos</div>
      </div>
    </div>

    <script>
      // --- Verrouillage orientation paysage (PWA / Android Chrome) ---
      window.addEventListener("load", function () {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(function (e) {
            console.log("Verrouillage orientation bloqué :", e);
          });
        }
      });

      // --- Desactive le context menu sur clic droit et le zoom pinch-to-zoom ---
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      // --- Config Unity ---
      var buildUrl  = "Build";
      var loaderUrl = buildUrl + "/docs.loader.js";

      var config = {
        dataUrl:            buildUrl + "/docs.data",
        frameworkUrl:       buildUrl + "/docs.framework.js",
        codeUrl:            buildUrl + "/docs.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "DefaultCompany",
        productName:        "Globulos",
        productVersion:     "0.5",
        showBanner:         unityShowBanner,
      };

      var canvas      = document.querySelector("#unity-canvas");
      var loadingBar  = document.querySelector("#unity-loading-bar");
      var progressBar = document.querySelector("#unity-progress-bar-full");
      var fullscreenBtn = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style.cssText = "background:red;color:#fff;padding:10px;";
        } else {
          if (type === "warning") div.style.cssText = "background:yellow;padding:10px;";
          setTimeout(function () { warningBanner.removeChild(div); }, 5000);
        }
      }

      // --- Adaptation mobile ---
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        // Reduit le pixel ratio pour economiser les performances sur mobile
        config.devicePixelRatio = 1;
        // PAS de message d erreur : on laisse Unity se charger normalement
      }

      // --- Chargement ---
      loadingBar.style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBar.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";
          fullscreenBtn.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
