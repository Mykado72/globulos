<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | New Globulos</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: #231F20;
        overflow: hidden;
      }

      #unity-container {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #231F20;
      }

      /* ✅ Overlay pour mode portrait - centré, semi-transparent */
      #portrait-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      #portrait-overlay.show {
        display: flex;
      }

      #portrait-message {
        background: rgba(35, 31, 32, 0.95);
        padding: 40px 30px;
        border-radius: 16px;
        text-align: center;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 85%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      #portrait-message h1 {
        font-size: 28px;
        margin-bottom: 15px;
        color: #FFD700;
        font-weight: 600;
      }

      #portrait-message p {
        font-size: 16px;
        margin-bottom: 8px;
        line-height: 1.6;
      }

      #portrait-icon {
        font-size: 56px;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
      <!-- Affiche un message centré en mode portrait -->
      <div id="portrait-overlay">
          <div id="portrait-message">
              <div id="portrait-icon">📱</div>
              <h1>Tournez votre appareil</h1>
              <p>Veuillez passer en mode paysage pour jouer</p>
          </div>
      </div>
      <div id="unity-container">
          <canvas id="unity-canvas" width="1920" height="1080"></canvas>
      </div>
      <script src="Build/docs.loader.js"></script>
      <script>
          // ✅ Gestion de l'orientation (paysage/portrait)
          let unityInstance = null;
          let isPortrait = false;

          // Fonction pour vérifier l'orientation
          function checkOrientation() {
              // ✅ FIX : matchMedia est plus fiable que innerWidth/innerHeight sur mobile,
              // où la barre d'adresse qui apparaît/disparaît peut fausser innerHeight.
              const isLandscape = window.matchMedia("(orientation: landscape)").matches
                  || window.innerWidth > window.innerHeight;
              const overlay = document.getElementById("portrait-overlay");

              console.log("[Orientation] check → landscape =", isLandscape,
                  "(", window.innerWidth, "x", window.innerHeight, ")");

              if (!isLandscape) {
                  // 📱 Portrait détecté
                  if (!isPortrait) {
                      isPortrait = true;
                      overlay.classList.add("show");
                      // ✅ Appeler PauseManager au lieu de TurnManager
                      if (unityInstance) {
                          unityInstance.SendMessage("PauseManager", "PauseGame");
                      }
                      console.log("📱 Mode portrait détecté → Pause activée");
                  }
              } else {
                  // 🏜️ Paysage détecté
                  if (isPortrait) {
                      isPortrait = false;
                      overlay.classList.remove("show");
                      // ✅ Appeler PauseManager au lieu de TurnManager
                      if (unityInstance) {
                          unityInstance.SendMessage("PauseManager", "ResumeGame");
                      }
                      // console.log("🏜️ Mode paysage détecté → Jeu repris");
                  }
              }
          }

          // Écouter les changements d'orientation
          window.addEventListener("orientationchange", checkOrientation);
          window.addEventListener("resize", checkOrientation);
          // ✅ FIX : matchMedia expose aussi son propre événement de changement, plus fiable
          // que resize/orientationchange seuls sur certains navigateurs mobiles.
          if (window.matchMedia) {
              window.matchMedia("(orientation: landscape)").addEventListener("change", checkOrientation);
          }

          // Vérification initiale au chargement
          window.addEventListener("load", () => {
              setTimeout(checkOrientation, 100);
          });
          // ✅ FIX : appel immédiat aussi (sans attendre "load"), au cas où l'overlay doive
          // s'afficher avant même la fin du chargement des assets Unity.
          checkOrientation();

          // ===== Musique de fond (gérée côté page, pilotée par Unity) =====
          const music = new Audio();
          music.loop = true;
          music.volume = 0.5;
          let currentMusicUrl = "";
          let musicWanted = false;

          function tryPlayMusic() {
              if (!musicWanted || !music.src) return;
              const p = music.play();
              if (p) p.catch(() => { /* autoplay bloqué : on attend un geste */ });
          }

          // Appelées depuis Unity (via le .jslib)
          window.playMusic = function (url, loop) {
              music.loop = loop;
              if (url !== currentMusicUrl) {
                  currentMusicUrl = url;
                  music.src = url;
              }
              musicWanted = true;
              tryPlayMusic();
          };
          window.stopMusic = function () {
              musicWanted = false;
              music.pause();
              music.currentTime = 0;
          };
          window.setMusicVolume = function (v) {
              music.volume = Math.min(1, Math.max(0, v));
          };

          // Morceau par défaut dès l'ouverture de la page
          window.playMusic("StreamingAssets/Music/menu.mp3", true);

          // Si l'autoplay est bloqué, on démarre au premier geste de l'utilisateur
          ["pointerdown", "touchend", "keydown", "click"].forEach((evt) => {
              window.addEventListener(evt, function unlock() {
                  tryPlayMusic();
                  if (!music.paused) {
                      ["pointerdown", "touchend", "keydown", "click"].forEach((e) =>
                          window.removeEventListener(e, unlock));
                  }
              }, { passive: true });
          });

          createUnityInstance(document.querySelector("#unity-canvas"), {
              dataUrl: "Build/docs.data",
              frameworkUrl: "Build/docs.framework.js",
              codeUrl: "Build/docs.wasm",
              streamingAssetsUrl: "StreamingAssets",
              companyName: "Mykado",
              productName: "New Globulos",
              productVersion: "1.0",
              // 🔒 Verrouille la résolution de rendu interne à 1920x1080
              matchWebGLToCanvasSize: false,
          }).then((instance) => {
              unityInstance = instance;
              // ✨ FIX clavier mobile WebGL : `unityInstance` est déclaré avec `let`, donc
              // jamais posé sur `window`. Un plugin jslib (ex: WebGLInput  qui a
              // besoin d'appeler unityInstance.SendMessage(...) pour synchroniser le texte du
              // clavier virtuel cherche généralement `window.unityInstance` — on l'expose donc
              // explicitement ici, en plus de la variable locale déjà utilisée plus haut.
              window.unityInstance = instance;
              // Vérifier l'orientation après le chargement d'Unity
              setTimeout(checkOrientation, 200);
          });
      </script>
  </body>
</html>
