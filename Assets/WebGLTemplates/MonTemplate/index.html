<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | New Globulos</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        border: 0;
        width: 100%;
        height: 100%;
        background: #231F20;
        overflow: hidden;
      }

      /* Conteneur plein écran qui centre le canvas, quelle que soit la taille
         réelle de la fenêtre du navigateur. */
      #unity-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #231F20;
      }

      /* Le canvas garde son ratio interne 1920x1080 (16:9, défini par les
         attributs width/height ci-dessous, PAS par ce CSS) et se redimensionne
         pour tenir entièrement dans la fenêtre (object-fit: contain = jamais
         de recadrage, léger letterboxing si le ratio de la fenêtre diffère
         du 16:9). C'est ce qui remplace le style fixe "width:1920px;
         height:1080px" qui débordait de toute fenêtre plus petite. */
      #unity-canvas {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        background: #231F20;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080"></canvas>
    </div>
    <script src="Build/docs.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/docs.data",
        frameworkUrl: "Build/docs.framework.js",
        codeUrl: "Build/docs.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Mykado",
        productName: "New Globulos",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      });
    </script>
  </body>
</html>
